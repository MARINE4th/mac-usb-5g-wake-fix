<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 810" width="1100" height="810" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803D"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>

  <rect x="0" y="0" width="1100" height="810" rx="16" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="550" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#1E293B">Mac 唤醒后 5G 通信壳断网：自动修复架构</text>
  <text x="550" y="70" text-anchor="middle" font-size="13" fill="#64748B">网卡链路卡死，但同一根线上的 ADB 通道仍然可用，于是用 ADB 让设备自己“软件插拔”一次</text>

  <!-- ===== Mac side ===== -->
  <rect x="30" y="90" width="460" height="580" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="50" y="118" font-size="15" font-weight="700" fill="#1E293B">macOS</text>

  <rect x="60" y="140" width="200" height="44" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
  <text x="160" y="167" text-anchor="middle" font-size="13" fill="#1E293B">睡眠 / 合盖后唤醒</text>

  <rect x="60" y="210" width="200" height="44" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="160" y="237" text-anchor="middle" font-size="13" fill="#1E293B">sleepwatcher（常驻）</text>

  <rect x="60" y="280" width="200" height="84" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="160" y="304" text-anchor="middle" font-size="13" font-weight="700" fill="#1E293B">~/.wakeup</text>
  <text x="76" y="328" font-size="12" fill="#334155">1. ioreg：设备插着吗？</text>
  <text x="76" y="349" font-size="12" fill="#334155">2. 每 0.5s 查 en6，最多 5s</text>

  <rect x="60" y="390" width="200" height="60" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="160" y="414" text-anchor="middle" font-size="13" font-weight="700" fill="#1E293B">~/.usbnet/reconnect.sh</text>
  <text x="160" y="436" text-anchor="middle" font-size="12" fill="#334155">记录状态，调用 adb</text>

  <rect x="60" y="560" width="200" height="48" rx="8" fill="#DCFCE7" stroke="#15803D" stroke-width="1.5"/>
  <text x="160" y="589" text-anchor="middle" font-size="13" fill="#1E293B">adb（走 USB）</text>

  <line x1="160" y1="184" x2="160" y2="208" stroke="#2563EB" stroke-width="1.8" marker-end="url(#ab)"/>
  <line x1="160" y1="254" x2="160" y2="278" stroke="#2563EB" stroke-width="1.8" marker-end="url(#ab)"/>
  <line x1="160" y1="364" x2="160" y2="388" stroke="#2563EB" stroke-width="1.8" marker-end="url(#ab)"/>
  <text x="172" y="380" font-size="11" fill="#2563EB">en6 断开</text>
  <line x1="160" y1="450" x2="160" y2="558" stroke="#2563EB" stroke-width="1.8" marker-end="url(#ab)"/>

  <!-- step 1 badge -->
  <circle cx="190" cy="196" r="11" fill="#2563EB"/>
  <text x="190" y="200.5" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">1</text>

  <!-- SwiftBar plugin (optional) -->
  <rect x="290" y="280" width="180" height="130" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="380" y="304" text-anchor="middle" font-size="13" font-weight="700" fill="#1E293B">SwiftBar 状态栏（可选）</text>
  <circle cx="335" cy="327" r="7" fill="#22C55E"/>
  <circle cx="362" cy="327" r="7" fill="#EAB308"/>
  <circle cx="389" cy="327" r="7" fill="#EF4444"/>
  <circle cx="416" cy="327" r="7" fill="#CBD5E1"/>
  <text x="380" y="356" text-anchor="middle" font-size="12" fill="#334155">平时每 10s 刷新</text>
  <text x="380" y="376" text-anchor="middle" font-size="12" fill="#334155">唤醒/重连后 10s 内 0.1s</text>
  <text x="380" y="396" text-anchor="middle" font-size="12" fill="#334155">内容不变不重绘</text>

  <line x1="260" y1="322" x2="288" y2="322" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ab)"/>
  <line x1="260" y1="420" x2="300" y2="412" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ab)"/>
  <text x="274" y="315" text-anchor="middle" font-size="10" fill="#2563EB">USR1</text>

  <rect x="290" y="470" width="180" height="48" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="380" y="499" text-anchor="middle" font-size="13" fill="#1E293B">en6（CDC-ECM 网卡）</text>
  <line x1="380" y1="410" x2="380" y2="468" stroke="#475569" stroke-width="1.3" stroke-dasharray="2 3" marker-end="url(#ak)"/>
  <text x="388" y="444" font-size="11" fill="#475569">读取状态</text>

  <!-- ===== Cable band ===== -->
  <rect x="495" y="452" width="110" height="160" rx="6" fill="#F1F5F9"/>
  <text x="550" y="445" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">USB-C</text>

  <!-- red lane: ECM -->
  <line x1="470" y1="494" x2="648" y2="494" stroke="#DC2626" stroke-width="3"/>
  <text x="560" y="484" text-anchor="middle" font-size="12" fill="#DC2626">唤醒后卡在 inactive</text>
  <circle cx="560" cy="512" r="11" fill="#DC2626"/>
  <text x="560" y="516.5" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">2</text>

  <!-- green lane: ADB -->
  <line x1="260" y1="584" x2="646" y2="584" stroke="#15803D" stroke-width="3" marker-end="url(#ag)"/>
  <text x="560" y="574" text-anchor="middle" font-size="12" fill="#15803D">ADB 通道仍可用</text>
  <circle cx="560" cy="602" r="11" fill="#15803D"/>
  <text x="560" y="606.5" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">3</text>

  <!-- ===== Device side ===== -->
  <rect x="610" y="90" width="460" height="580" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="630" y="118" font-size="15" font-weight="700" fill="#1E293B">5G 通信壳（紫光展锐 UDX710 · 嵌入式 Linux）</text>

  <rect x="640" y="140" width="400" height="50" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="840" y="170" text-anchor="middle" font-size="13" fill="#1E293B">基带 / 蜂窝数据连接：全程在线，无需重新拨号</text>

  <rect x="640" y="210" width="400" height="50" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="840" y="240" text-anchor="middle" font-size="13" fill="#1E293B">网页后台 192.168.66.1（网页终端：安装脚本用）</text>

  <rect x="640" y="290" width="400" height="70" rx="8" fill="#DCFCE7" stroke="#15803D" stroke-width="1.5"/>
  <text x="840" y="318" text-anchor="middle" font-size="13" font-weight="700" fill="#1E293B">/mnt/userdata/usbwd/rebind.sh</text>
  <text x="840" y="342" text-anchor="middle" font-size="12" fill="#334155">忽略挂断信号 → 写 UDC：解绑 → 等 2s → 重新绑定</text>

  <rect x="630" y="400" width="420" height="220" rx="10" fill="none" stroke="#64748B" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text x="645" y="424" font-size="13" font-weight="700" fill="#475569">USB gadget（configfs：g1）</text>

  <rect x="650" y="470" width="170" height="48" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="735" y="499" text-anchor="middle" font-size="13" fill="#1E293B">ECM 网卡功能</text>

  <rect x="650" y="560" width="170" height="48" rx="8" fill="#DCFCE7" stroke="#15803D" stroke-width="1.5"/>
  <text x="735" y="589" text-anchor="middle" font-size="13" fill="#1E293B">ADB 功能</text>

  <rect x="860" y="470" width="170" height="138" rx="8" fill="#FFFFFF" stroke="#15803D" stroke-width="1.5"/>
  <text x="945" y="500" text-anchor="middle" font-size="13" font-weight="700" fill="#1E293B">UDC 控制器</text>
  <text x="945" y="522" text-anchor="middle" font-size="12" fill="#64748B">29100000.dwc3</text>
  <text x="945" y="558" text-anchor="middle" font-size="12" fill="#334155">解绑 ＝ 拔出</text>
  <text x="945" y="580" text-anchor="middle" font-size="12" fill="#334155">绑定 ＝ 插入</text>

  <!-- ADB function -> rebind.sh -->
  <path d="M820,584 H840 V362" fill="none" stroke="#15803D" stroke-width="1.8" marker-end="url(#ag)"/>
  <!-- rebind.sh -> UDC -->
  <line x1="945" y1="360" x2="945" y2="468" stroke="#15803D" stroke-width="1.8" marker-end="url(#ag)"/>
  <circle cx="975" cy="414" r="11" fill="#15803D"/>
  <text x="975" y="418.5" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">4</text>

  <!-- re-enumeration back to en6 -->
  <path d="M945,608 V656 H380 V520" fill="none" stroke="#2563EB" stroke-width="1.8" stroke-dasharray="7 4" marker-end="url(#ab)"/>
  <circle cx="404" cy="638" r="11" fill="#2563EB"/>
  <text x="404" y="642.5" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">5</text>
  <text x="420" y="643" font-size="12" fill="#2563EB">重新识别 → en6 恢复（约 7 秒）</text>

  <!-- ===== Legend ===== -->
  <line x1="30" y1="692" x2="1070" y2="692" stroke="#E2E8F0" stroke-width="1"/>

  <circle cx="46" cy="716" r="10" fill="#2563EB"/><text x="46" y="720" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">1</text>
  <text x="64" y="720" font-size="13" fill="#334155">唤醒后 sleepwatcher 运行 ~/.wakeup，确认设备插着、en6 已断开</text>

  <circle cx="566" cy="716" r="10" fill="#DC2626"/><text x="566" y="720" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">2</text>
  <text x="584" y="720" font-size="13" fill="#334155">网卡链路卡在 inactive，设备自己察觉不到</text>

  <circle cx="46" cy="746" r="10" fill="#15803D"/><text x="46" y="750" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">3</text>
  <text x="64" y="750" font-size="13" fill="#334155">reconnect.sh 经 USB ADB 调用设备上的 rebind.sh</text>

  <circle cx="566" cy="746" r="10" fill="#15803D"/><text x="566" y="750" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">4</text>
  <text x="584" y="750" font-size="13" fill="#334155">rebind.sh 解绑再绑定 UDC，相当于软件插拔</text>

  <circle cx="46" cy="776" r="10" fill="#2563EB"/><text x="46" y="780" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">5</text>
  <text x="64" y="780" font-size="13" fill="#334155">Mac 重新识别设备，网卡恢复；状态栏插件全程显示进度（可选）</text>
</svg>
